# 一次性用于建立 Prettier 格式基线；完成后会从 PR 分支移除。
name: Frontend format bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/frontend-quality-gates' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci/frontend-quality-gates

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Establish formatting baseline and update lockfile
        working-directory: frontend
        run: |
          npm install --save-dev --save-exact prettier@3.9.9
          npm run format
          npm run format:check

      - name: Commit one-time baseline to the PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No baseline changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "style(frontend): establish Prettier formatting baseline"
          git push origin HEAD:ci/frontend-quality-gates
