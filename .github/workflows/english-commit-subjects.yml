name: English commit subjects

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  english-subjects:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title and commit subjects
        uses: actions/github-script@v7
        with:
          script: |
            const ascii = /^[\x20-\x7E]+$/;
            const title = context.payload.pull_request.title;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const invalid = [];
            if (!ascii.test(title)) invalid.push('PR title');
            for (const commit of commits) {
              const subject = commit.commit.message.split('\n')[0];
              if (!ascii.test(subject)) {
                invalid.push(`commit ${commit.sha.slice(0, 7)}: ${subject}`);
              }
            }
            if (invalid.length) {
              core.setFailed('Use English (ASCII) PR titles and commit subjects:\n' + invalid.join('\n'));
            }
