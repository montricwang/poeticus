name: Python dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'requirements*.txt'
      - '.github/workflows/python-dependency-audit.yml'

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install audit tool
        run: python -m pip install pip-audit
      - name: Audit Python runtime requirements
        run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Audit Python development requirements
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
