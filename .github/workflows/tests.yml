name: Tests

on:
  push:
    branches: [main, feat/public-ai-safety, release/v0.1.0-rc-integration]
  pull_request:
    branches: [main, release/v0.1.0-rc-integration]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LLM_API_KEY: test-only-placeholder
      LANGSMITH_TRACING: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production npm dependencies (high or critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Inspect reader navigation formatting
        run: |
          npx prettier --write src/components/reader-navigation.tsx
          git diff -- src/components/reader-navigation.tsx

      - name: Check frontend formatting
        run: npm run format:check

      - name: Type-check and build frontend
        run: npm run build

      - name: Test poem mapping and Unicode offsets
        run: node --experimental-strip-types --test tests/*.test.mjs

