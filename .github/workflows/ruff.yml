name: Python lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.10"
          args: "check --output-format=github"
